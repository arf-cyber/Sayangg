<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Girlfriend Day! ✈️❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 25px;
            box-shadow: 0 12px 30px rgba(255, 71, 87, 0.2);
            text-align: center;
            max-width: 390px;
            width: 100%;
        }

        h1 {
            color: #ff4757;
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        /* Counter Box */
        .days-box {
            background: #ffe6ed;
            border: 2px dashed #ff4757;
            padding: 8px 12px;
            border-radius: 12px;
            color: #ff4757;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        /* Photo Slider */
        .slider-box {
            width: 100%;
            height: 220px;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
            border: 4px solid #ff4757;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .slides {
            display: flex;
            width: 300%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .slides img {
            width: 33.333%;
            height: 100%;
            object-fit: cover;
        }

        .slide-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            color: #ff4757;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .prev { left: 8px; }
        .next { right: 8px; }

        .tagline {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* Button Grid */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            background: #fff0f3;
            color: #d63031;
            border: 2px solid #ffb6c1;
            padding: 11px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            padding-left: 15px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-main {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            text-align: center;
            box-shadow: 0 4px 12px rgba(255, 65, 108, 0.3);
        }

        .btn-music {
            background: #ffeaa7;
            color: #d63031;
            border: 2px solid #fdcb6e;
            text-align: center;
        }

        /* Result Box */
        .result-box {
            display: none;
            background: #fff5f7;
            padding: 15px;
            border-radius: 15px;
            color: #ff4757;
            font-weight: 600;
            font-size: 0.85rem;
            margin-top: 10px;
            border: 2px dashed #ff4757;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        audio { display: none; }
    </style>
</head>
<body>

    <audio id="myAudio" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <h1>Happy Girlfriend Day! ✈️💖</h1>

        <!-- Counter Days -->
        <div class="days-box">
            LDR Barengan Sudah: <span id="daysCount">0</span> Hari ✨
        </div>

        <!-- Slider Foto -->
        <div class="slider-box">
            <button class="slide-btn prev" onclick="moveSlide(-1)">❮</button>
            <button class="slide-btn next" onclick="moveSlide(1)">❯</button>
            <div class="slides" id="slides">
                <img src="foto1.jpg" onerror="this.src='https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=600'" alt="Foto 1">
                <img src="foto2.jpg" onerror="this.src='https://images.unsplash.com/photo-1516589178581-6cd7871f9299?q=80&w=600'" alt="Foto 2">
                <img src="foto3.jpg" onerror="this.src='https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=600'" alt="Foto 3">
            </div>
        </div>

        <p class="tagline">Pilih agenda Virtual Date kita hari ini: ⤵️</p>

        <!-- 5 Pilihan (Dengan Tombol Beli Maaf) -->
        <div class="btn-grid">
            <button class="btn btn-music" onclick="toggleAudio()">🎵 <span id="musicText">Putar Lagu Favorit Kita</span></button>
            <button class="btn" onclick="pilihVirtualDate()">🎬 1. Ide Kencan Virtual Hari Ini</button>
            <button class="btn" onclick="pilihGameLDR()">🎮 2. Rekomendasi Game Main Bareng</button>
            <button class="btn" onclick="pilihTopikCurhat()">💬 3. Topik Obrolan / Deep Talk Nanti Malam</button>
            <button class="btn" onclick="cekKangen()">🥺 4. Cek Level Kangen Hari Ini</button>
            <button class="btn btn-main" onclick="pujainDulu()">😤 5. Kalau Masih Marah / Ngambek (Klik Sini!)</button>
        </div>

        <div class="result-box" id="resultText"></div>
    </div>

    <script>
        // 1. Tanggal Jadian / LDR
        const startDate = new Date("2024-01-01");
        const today = new Date();
        const diffDays = Math.ceil(Math.abs(today - startDate) / (1000 * 60 * 60 * 24));
        document.getElementById("daysCount").innerText = diffDays;

        // 2. Slider Foto
        let slideIndex = 0;
        function moveSlide(dir) {
            const slides = document.getElementById("slides");
            slideIndex += dir;
            if (slideIndex > 2) slideIndex = 0;
            if (slideIndex < 0) slideIndex = 2;
            slides.style.transform = `translateX(-${slideIndex * 33.333}%)`;
        }

        // 3. Audio Control
        var audio = document.getElementById("myAudio");
        var isPlaying = false;

        function playMusic() {
            if (!isPlaying) {
                audio.play();
                isPlaying = true;
                document.getElementById("musicText").innerText = "Lagu Sedang Diputar 🎶";
            }
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                isPlaying = true;
                document.getElementById("musicText").innerText = "Lagu Sedang Diputar 🎶";
            } else {
                audio.pause();
                isPlaying = false;
                document.getElementById("musicText").innerText = "Putar Lagu Favorit Kita";
            }
        }

        // 4. Response Buttons
        function showBox(text) {
            playMusic();
            const box = document.getElementById("resultText");
            box.style.display = "block";
            box.innerHTML = text;
        }

        function pilihVirtualDate() {
            const list = [
                "Nonton Film Bareng via Teleparty / Discord 🍿",
                "Sleepcall Sampai Tertidur Pulap 💤",
                "Virtual Dinner (Makan Bareng On-Cam) 🕯️",
                "Virtual Museum / Jalan-jalan via Google Earth 🗺️",
                "Dengerin Podcast / Playlist Lagu Bareng 🎧"
            ];
            const res = list[Math.floor(Math.random() * list.length)];
            showBox("Agenda Virtual Date kita hari ini:<br><span style='font-size:1.1rem; color:#d63031;'>" + res + "</span><br>(Nanti malam luangin waktu ya, gak boleh ketiduran! 😜)");
        }

        function pilihGameLDR() {
            const list = [
                "Ludo King / UNO Online 🎲",
                "Roblox Bareng 🤖",
                "Stumble Guys / Eggy Party 🏃‍♂️",
                "PlateUp! / Overcooked (Kalo PC) 🍳",
                "Tebak Kata / Plato Games 📱"
            ];
            const res = list[Math.floor(Math.random() * list.length)];
            showBox("Sistem nentuin game yang meledak bareng:<br><span style='font-size:1.1rem; color:#d63031;'>" + res + "</span><br>(Yang kalah harus nurutin permintaan yang menang! 🤪)");
        }

        function pilihTopikCurhat() {
            const list = [
                "Cerita Momen Paling Lucu Pas Awal Ketemu 🤣",
                "Rencana Liburan Bareng Pas Ketemuan Nanti ✈️",
                "Deep Talk: Momen Paling Bersyukur Punya Kamu 💖",
                "Tebak-tebakan Rahasia Kecil Masing-masing 🤫"
            ];
            const res = list[Math.floor(Math.random() * list.length)];
            showBox("Topik obrolan kita pas Voice Call / Video Call:<br><span style='font-size:1.1rem; color:#d63031;'>" + res + "</span><br>(Siapin minuman hangat biar makin asik ngobrolnya!)");
        }

        let kangen = 999;
        function cekKangen() {
            kangen += 9999;
            showBox("Level kangen aku ke kamu saat ini:<br><span style='font-size:1.2rem; color:#ff4757;'>" + kangen + "%</span><br>(Gak bisa diukur pake kilometer lagi! ✈️❤️)");
        }

        function pujainDulu() {
            showBox("Jangan marah-marah dong cantiknya akuu... 🥺👉👈<br><br>Aku minta maaf ya kalau ada salah. Kirimkan permintaan kamu via WhatsApp sekarang, nanti aku turutin semuanya! Smile dong, Happy Girlfriend Day sayang! 💖✨");
        }
    </script>
</body>
</html>
